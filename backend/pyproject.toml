[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxmedicine-backend"
version = "0.1.0"
description = "LuxMedicine — Clinical Search & Retrieval Engine (extractive, source-attributed)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    # MIT, as is its pdfminer.six engine. Chosen over PyMuPDF, which is AGPL-3.0 and
    # would put a copyleft obligation on a hosted clinical service.
    "pdfplumber>=0.11.4",
    # Splitting oversized uploads into page-bounded parts (corpus upload). pdfplumber reads text
    # but does not write PDFs; pypdf does. Imported at app startup by services/pdf_split.
    "pypdf>=4.0",
    # Reading .xlsx spreadsheets for the GAEB converter (services/gaeb). A Leistungsverzeichnis is
    # most often kept in Excel, and columns there are explicit — the high-fidelity input path.
    "openpyxl>=3.1",
    # Identity (#30). `[crypto]` pulls in `cryptography` for RS256 — without the
    # extra, pyjwt silently supports only HMAC and every RS256 token fails.
    "pyjwt[crypto]>=2.10",
    # Runtime, not just tests: JWKS and OIDC discovery are outbound HTTP.
    "httpx>=0.28",
]

[project.optional-dependencies]
# Kept out of the default install: torch plus multilingual-e5-large is several GB, and
# the API, the tests, and CI never load the model — tests use a deterministic fake.
# The real embedder is exercised by tests/test_embedding_real.py, which skips unless
# this extra is present.
embeddings = ["sentence-transformers>=3.0"]

# The same multilingual-e5-large, run as an int8 ONNX graph — deliberately WITHOUT torch or
# sentence-transformers, so the runtime footprint drops from ~2.3 GB to a few hundred MB. This is
# the production embedder on a memory-constrained host; `transformers` here is the tokenizer only
# (no torch is pulled by importing AutoTokenizer). The int8 model is a build artifact, not a dep.
onnx = ["onnxruntime>=1.20", "transformers>=4.40", "tokenizers>=0.20"]

# The extraction step (#18). Kept out of the default install for the same reason as the
# embedder — and for one more: it needs an API key and it costs money per call, so
# nothing should reach for it by accident. app/services/extractor_claude.py has NOT been
# run; see its docstring.
llm = ["anthropic>=0.116"]

# The Gemini adapter. Kept separate from `llm` so installing one does not drag in the
# other: they are alternative implementations of the same protocol, not a stack.
# google-genai, NOT google-generativeai -- the latter is retired.
gemini = ["google-genai>=1.0"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Test-only: builds real multi-page PDFs with known text, so extraction is tested
    # against a genuine PDF rather than against a fixture that flatters the parser.
    "reportlab>=4.2",
    # Pinned, not `>=`: CI installs fresh each run, so an unpinned ruff silently adopts
    # every new release and its new lint rules — which is how a file nobody touched
    # (alembic/env.py) started failing lint on an unrelated commit. Bump deliberately.
    "ruff==0.15.21",
]

# Without this, setuptools sees both `app/` and `alembic/` at the root and refuses
# to guess which one is the package.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    # Loads the real multilingual-e5-large (~2.2 GB, minutes on CPU). Skipped
    # automatically when the 'embeddings' extra is absent, which is how CI avoids it.
    # Locally: -m "not slow" to skip, and run it before trusting a corpus to the model.
    "slow: exercises the real embedding model",
]
