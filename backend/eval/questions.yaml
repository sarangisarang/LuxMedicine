# The question set. Every entry carries what we expect BEFORE the run, because a number
# you can interpret after the fact is a number you can talk yourself into.
#
# `expect` is the load-bearing field:
#
#   answerable  — the corpus contains a passage that answers this. A no-answer here is the
#                 system being wrong (too conservative), and that is the failure worth
#                 finding: it is invisible from the outside, because an honest "I don't
#                 know" looks identical to a wrongly withheld answer.
#   not_covered — the corpus genuinely does not cover this. A no-answer here is the system
#                 being RIGHT, and an answer here is the dangerous case.
#
# Without `not_covered` entries the run measures only the happy path and cannot tell a
# correct refusal from a wrong one — the whole rate collapses into one uninterpretable
# percentage. That is the trap `luxmedicine-blockers` warns about: "do not run 500 questions
# and call the number the model's hallucination rate".
#
# `source` records where we believe the answer is, so a wrong-document answer is visible as
# a wrong-document answer rather than counted as a success.
#
# The corpus this is written against (2026-07-23). ACTIVE:
#   CDC US MEC 2024   — contraception  1546 chunks, 129pp
#   CDC US SPR 2024   — contraception   482 chunks,  80pp
#   HOAI 2023 / VgV / GWB — German construction and procurement law (sector: legal)
#
# WITHDRAWN, and each for a different reason — the distinction matters when reading a
# `withdrawn_declined`:
#   KDIGO 2012        — CKD            licence (#49)
#   NICE NG106 2018   — heart failure  licence (#49)
#   NHLBI EPR-3 2007  — asthma         corpus focus, 2026-07-23. Not a licence problem: the
#                                      only document in a domain nothing else covered, a US
#                                      guideline where German practice follows AWMF/NVL, and
#                                      the most damaged file here (116 of 440 pages holding
#                                      no chunk, 88 more partly read). Reversible with
#                                      `app.cli.withdraw --org NHLBI --restore`.
#
# **The medical corpus is now reproductive health only.** Any new question must be answerable
# from CDC MEC or SPR, or it belongs in `not_covered` — and asthma, CKD and heart failure are
# all `withdrawn_source`, not `not_covered`, because the difference between "we never had it"
# and "we removed it" is a fact about us that a bucket must not hide.
#
# **The comparison baseline is 20260723T162231Z, and inventions are only comparable from it.**
# Every earlier run's `inventions` number rested on a `_corpus_contains` that searched the whole
# chunks table — withdrawn documents, superseded rows, and 823 bibliography chunks #50 excludes
# from retrieval — so a fabricated 4-gram that happened to exist in unreachable text scored
# `inventions: 0` and a real answer whose 4-gram newly appeared there scored a false invention.
# References are the worst of it: they are dense with clinically-plausible n-grams (paper titles,
# conditions, author terminology), all 823 in the medical sector, so the false-negative was not
# theoretical but concentrated exactly where fabrication matters most. Fixed 2026-07-23; this run
# is the first taken on the corrected predicate. Do NOT compare its inventions to an older run.
#
# **NOT YET WRITTEN, and the first thing to add after the provider comparison: a cross-cutting
# question.** The corpus is no longer "medical + legal" in general — it is two narrow verticals,
# reproductive health and German construction fee law, with nothing between them. The sector
# wall is more obviously right at that distance, and a wall that wrongly kills a question is
# correspondingly harder to notice: nobody expects an overlap, so nobody looks for one.
#
# The shape to write is a question a reader might reasonably put to EITHER corpus — consent,
# documentation duty, record-keeping — and to assert what should happen: answered from the
# sector that holds it, declined in the other, and the decline distinguishable from "nothing
# exists anywhere". Today a query in the wrong sector returns `sources_do_not_answer` with no
# indication that another corpus was never searched, which is correct but unhelpful, and this
# file cannot currently tell the two apart.
#
# Deliberately NOT added yet: the instrument is frozen for the Vertex comparison, and a
# question added to one side of it would make the difference unattributable — the failure this
# whole sequence is arranged to avoid.
#
# **BEFORE ADDING QUESTIONS: check `python -m app.cli.coverage` first.**
#
# Writing questions by reading a PDF measures the PDF, not the index — and those differ.
# The case that established it: NHLBI EPR-3 was 440 pages of which 324 were indexed — 116 with
# no live chunk at all and 88 more partly read, so NOT-ANSWERABLE is the floor of the hole and
# not its size. (That document is now withdrawn; the rule is not about it.) A question written
# from a missing page is unanswerable by construction.
# The system will correctly say "no guidance found", this file will score `wrongly_declined`,
# and the run will read as an accuracy problem when it is a COVERAGE problem. The two are not
# fixed by the same work, and a number that mixes them measures neither.
#
# So: write from pages the coverage report shows as indexed, or — if a question about a missing
# page is deliberate — say so in its note, so nobody later reads the failure as the model's.
#
# **`expect_pages` is now coupled to ingestion, and only a warning guards it.** Chunks can be
# superseded (`chunks.superseded_by`) — retired from retrieval, kept in the table — and a row
# re-read by a fixed extractor can land on a different page than the one it replaced. So a page
# number written against yesterday's corpus goes stale in two opposite-looking ways:
#
#   false off_source  the answer moved to a page this list does not name, and a CORRECT answer
#                     is scored as coming from the wrong table
#   false answered    the list still names a page whose rows are all retired, so a citation
#                     there counts as on-source when nothing active could have produced it
#
# Live instance, left uncorrected on purpose: `contraception-migraine-aura` cites p124 while
# this file expects [69, 123] — and its own note names p124 as where the self-describing rows
# were added. The expectation is stale, not the answer. It stays until the provider comparison
# is finished, because an instrument that changes between two runs measures neither.
#
# `app/cli/evaluate.check_ground_truth` prints a warning for the mechanical half (a listed page
# with no active chunk left) before any question runs. It cannot tell whether an active page
# still ANSWERS — that needs a reader — so a page that merely stopped being right stays silent.
#
# **Growing the corpus can invalidate a `not_covered` label, and a stale label is worse than
# no label** — it turns a correct answer into a scored failure, or hides a real one. When
# documents are added, re-check every `not_covered` entry by looking for the ANSWER in the
# chunks, not by looking at what retrieval returns: retrieval always returns its k nearest
# neighbours, so "CDC came back" is not evidence that CDC answers anything. Re-checked after
# the CDC ingest: all five still hold (no methyldopa/labetalol, no COVID antiviral, no HbA1c
# target, no sepsis bundle, no thrombolysis window anywhere in the corpus).

questions:
