  # --- contraception (CDC, public domain — the first licence-clean document) -----------

  # #48 lives here, and it scored `answered` for four consecutive runs before anyone looked at
  # WHICH page answered. The system quotes `ii. With aura 1` from p102 — verbatim, correctly
  # cited to CDC, zero rejections. p102 is TABLE E1, BARRIER methods: condoms, spermicide,
  # diaphragm. For those, 1 is right and beside the point. The answer a clinician needs is the
  # combined-hormonal category 4 — the stroke contraindication — and it is on p69/p123, in a
  # six-column summary row the model cannot quote verbatim without repairing it.
  #
  # So `expect_pages` is not bookkeeping here. It is the only field that separates the answer
  # from the answer-shaped thing: both are verbatim, both cite CDC, and only the page differs.
  # --- answerable: clean prose, verified by retrieval ---------------------------------

  - id: contraception-migraine-aura
    text: Which contraceptive methods are safe for women with migraine with aura?
    language: English
    expect: answerable
    source: CDC US MEC 2024
    expect_pages: [69, 123]
    tags: [table-48]
    note: >
      The full #48 arc, resolved. It scored `answered` (a silent success from the p102 barrier
      table) for four runs; then `answered_off_source` once expect_pages existed; then
      `table_not_citable` once the guard refused the headerless row; and now `answered` again —
      correctly this time, from the self-describing rows the structural extractor
      (services/table_extraction.py) added to p124/p69: "ii. With aura — Cu-IUD: 1, LNG-IUD: 1,
      Implant: 1, DMPA: 1, POP: 1, CHC: 4*". p69 is in expect_pages, so it is a clean answer,
      not off-source. One honest nuance: for "which methods are SAFE", the model quotes the
      category-1 methods and stops before "CHC: 4*" — a correct list of the safe methods, but
      it does not surface that CHC is contraindicated. The full row, CHC:4 included, is in the
      chunk and a direct question about CHC reaches it; completing the quote is #38's job.

  - id: contraception-migraine-aura-de
    text: Welche Verhütungsmethoden sind bei Migräne mit Aura sicher?
    language: German
    expect: answerable
    source: CDC US MEC 2024
    expect_pages: [69, 123]
    tags: [table-48]
    note: >
      verification_failed 3/3, and #48 explains it: the model reached for the p69/p123 row
      that genuinely answers, then repaired the six-column table into a clean `With aura 4`
      and #19 rejected it — correctly, since it had silently picked one column of six and
      dropped the asterisk. This failing while the English one "succeeded" is the system being
      SAFER in German. Not a translation bug; do not chase it as one.

  # The mislabelled-parent class, which no question in this file could see.
  #
  # Carrying a sub-row's parent condition into its label (so "migraine" reaches the row that
  # only says "ii. With aura") shipped with a flaw: a *sibling* data row whose own cells the
  # mapper refused was read as a heading, so the next sibling inherited it. On the real MEC
  # that produced 13 rows including "Compensated (normal liver — Decompensated (impaired —
  # …, CHC: 4" — the categories for DEcompensated cirrhosis presented under COMpensated, its
  # opposite. Verbatim, correctly cited to CDC, and clinically inverted: #48 exactly.
  #
  # It survived a full eval run because every table question here happened to be about
  # migraine. These two make the class visible: a condition whose neighbour is its opposite,
  # where reading the wrong sibling's row is a real clinical error rather than a wording slip.
  - id: contraception-cirrhosis-decompensated
    text: Can a woman with severe decompensated cirrhosis use combined hormonal contraception?
    language: English
    expect: answerable
    source: CDC US MEC 2024
    expect_pages: [22, 126]
    tags: [table-48, mislabelled-parent]
    note: >
      The answer is category 4 — contraindicated — and it lives in a table row whose immediate
      neighbour is MILD (compensated) cirrhosis, where CHC is category 1. So an off-by-one-row
      answer here is not "slightly wrong wording", it is the opposite recommendation with a
      correct citation. Watch which row is quoted, not only whether one was.

      Known limitation, honestly recorded rather than hidden by the phrasing: the emitted row
      reads "b. Decompensated (impaired — … CHC: 4". Two things are missing and both are
      separate from the parent fix. The parent "Cirrhosis" is not carried, because the rule
      only adopts an enumerated heading and "Cirrhosis" is a plain one; and the label is cut at
      "(impaired" because _row_label reads a single geometric row, so a label that wraps loses
      its tail (27 rows corpus-wide carry an unbalanced parenthesis from this).

  - id: contraception-valvular-complicated
    text: Is combined hormonal contraception safe in complicated valvular heart disease?
    language: English
    expect: answerable
    source: CDC US MEC 2024
    tags: [table-48, mislabelled-parent]
    note: >
      The second instance of the same shape — "Uncomplicated — Complicated (pulmonary …" was
      one of the 13. Complicated valvular disease (pulmonary hypertension, atrial fibrillation,
      subacute bacterial endocarditis) is category 4 for CHC while uncomplicated is category 2,
      so the two sibling rows again carry opposite advice. No expect_pages: this entry exists
      to watch the pairing, and pinning pages before measuring which one legitimately answers
      would be inventing the expectation rather than recording it.

  - id: contraception-postpartum
    text: When can a woman start a combined hormonal contraceptive after giving birth?
    language: English
    expect: answerable
    source: CDC US MEC 2024
    note: >
      Wrongly_declined until #50 — and the fix corrected a wrong guess of mine. I first judged
      this #48-class (answer only in a table) and claimed removing references would not help.
      Wrong: that was measured with a weak ad-hoc detector. With the real detector excluding
      bibliography (#50), retrieval surfaces the prose answer on p31 — "breastfeeding should
      not use CHCs <21 days postpartum (U.S. MEC 4)... 21 to <30 days (U.S. MEC 3)... without
      other risk factors for VTE generally can use CHCs" — the correct, complete VTE-timing
      answer, self-describing prose. It was there all along, buried under ~9 citations whose
      titles carried "combined hormonal contraceptive". Answers correctly now.

  - id: contraception-iud-timing
    text: When can an intrauterine device be inserted?
    language: English
    expect: answerable
    source: CDC US SPR 2024
    note: >
      A source-quality finding surfaced by verifying passing answers after #50, not a
      regression. Before #50 this answered from p52 — which is itself a reference chunk
      (is_reference=True). #50 correctly excluded it, and the answer moved to real evidence
      pages p39/40. But the model now quotes study-TITLE phrases from the evidence review
      ("Immediate postpartum versus 6-week postpartum intrauterine device insertion") rather
      than the recommendation. Weak, not wrong — the titles do name real insertion timings —
      and it is an extractor-quality issue (picking evidence-review titles), orthogonal to
      #50. The lesson stands: an answer counted "passing" was sourced from a reference the
      whole time, invisible until the sources were read.

  # The cross-specialty case, and the reason the corpus is never filtered by the clinician's
  # speciality. MEC 2024 added recommendations for chronic kidney disease, so the answer to a
  # nephrology question lives in a contraception guideline. A speciality filter would hide
  # exactly this — the answer that is hardest to find and most worth finding.
  - id: contraception-in-ckd
    text: Which contraceptive methods are appropriate for a woman with chronic kidney disease?
    language: English
    expect: answerable
    source: CDC US MEC 2024
    tags: [cross-specialty]
    note: >
      The architectural point still holds and the outcome changed honestly. It answered from
      marginal prose before #50; after excluding references, retrieval promotes the actual CKD
      eligibility table, which is headerless, so the #48 guard declines it as table_not_citable.
      That is not a specialty-filter failure — retrieval STILL finds the cross-domain CKD answer
      in a contraception guideline, which is the whole point; it is #48-blocked, like every
      table answer. Counts as wrongly_declined until #48's structural fix, and should.

  # --- #45 glyph corruption, where the answer lives in a table or threshold ------------
