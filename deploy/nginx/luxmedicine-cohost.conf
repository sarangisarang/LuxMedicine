# LuxMedicine behind ATOB's existing nginx (co-tenant deploy).
#
# Copy this to the AUTHORITATIVE nginx conf dir on the server:
#     /home/deploy/TrackTransporter/deploy/nginx/conf.d/luxmedicine.conf
# then:  docker exec deploy-nginx-1 nginx -t   (must pass)
#        docker exec deploy-nginx-1 nginx -s reload   (reload, NEVER restart)
# and verify ATOB is still up:
#        curl -s -o /dev/null -w '%{http_code}\n' https://api.atobtransport.de/api/transport-types  # 401/403 = ok
#
# Everything is scoped INSIDE server blocks on purpose — a conf.d file is included in nginx's http
# context, so a bare ssl_certificate or proxy_set_header here would become a DEFAULT for ATOB too.
# Nothing in this file leaks out of its server blocks.
#
# proxy_pass targets are docker network aliases (lux-web, lux-keycloak) that the luxmedicine-prod
# compose attaches to ATOB's `deploy_internal` network — see docker-compose.cohost.yml.
#
# One SAN cert covers both names; issue it into live/luxmedicin.atobtransport.de/ via the shared
# certbot webroot (/var/www/certbot) BEFORE this file is served on 443 — see deploy/README.md.

# --- HTTP: ACME challenge, then force HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name luxmedicin.atobtransport.de auth.luxmedicin.atobtransport.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- The application: browser -> Next.js frontend ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name luxmedicin.atobtransport.de;

    ssl_certificate     /etc/letsencrypt/live/luxmedicin.atobtransport.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxmedicin.atobtransport.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://lux-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --- Keycloak: browser reaches this for login; the API for JWKS ----------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.luxmedicin.atobtransport.de;

    ssl_certificate     /etc/letsencrypt/live/luxmedicin.atobtransport.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luxmedicin.atobtransport.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://lux-keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Keycloak emits large headers during login (state, cookies); give it room.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
